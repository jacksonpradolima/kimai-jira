name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify generated UI documentation
        run: npm run docs:ui:check

      - name: Build documentation strictly
        run: python -m zensical build -f zensical.toml --clean --strict

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Forge lint needs an authenticated Forge CLI session to validate
      # manifest.yml and module wiring. It uses a dedicated, non-production
      # Atlassian developer account created solely for CI linting (see
      # docs/development.md). Fork pull requests do not receive these secrets.
      - name: Forge lint
        if: ${{ env.FORGE_API_TOKEN != '' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          npx forge settings set usage-analytics false
          npm run forge:lint
