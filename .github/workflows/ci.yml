name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui_docs: ${{ steps.filter.outputs.ui_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui_docs:
              - 'src/frontend/**'
              - 'src/shared/**'
              - 'scripts/ui-docs/**'
              - 'docs/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

  validate:
    needs: changes
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Install Chromium for UI documentation
        if: needs.changes.outputs.ui_docs == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify generated UI documentation
        if: needs.changes.outputs.ui_docs == 'true'
        run: npm run docs:ui:check

      # `forge lint` needs an authenticated Forge CLI session to validate
      # manifest.yml and module wiring. It uses a dedicated, non-production
      # Atlassian developer account created solely for CI linting (see
      # docs/development.md) - never the maintainer's production Forge app
      # credentials. Those secrets are not exposed to pull requests from
      # forks, so this step is best-effort and must not fail the build for
      # external contributors; they can still run `npx forge lint` locally
      # against their own free Forge developer account.
      - name: Forge lint
        if: ${{ env.FORGE_API_TOKEN != '' }}
        continue-on-error: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: |
          npx forge settings set usage-analytics false
          npx forge lint
