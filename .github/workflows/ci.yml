name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `forge lint` needs an authenticated Forge CLI session to validate
      # manifest.yml and module wiring. It uses a dedicated, non-production
      # Atlassian developer account created solely for CI linting (see
      # docs/development.md) - never the maintainer's production Forge app
      # credentials. Those secrets are not exposed to pull requests from
      # forks, so this step is best-effort and must not fail the build for
      # external contributors; they can still run `npx forge lint` locally
      # against their own free Forge developer account.
      - name: Forge lint
        if: ${{ secrets.FORGE_API_TOKEN != '' }}
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        continue-on-error: true
        run: |
          npx forge settings set usage-analytics false
          npx forge lint
