name: Deploy

# Deployment is intentionally decoupled from CI validation (ci.yml) and is
# never triggered automatically by pull requests. It only runs when a
# maintainer explicitly dispatches it, and it requires the `forge-deploy`
# GitHub Environment to be configured with production Forge credentials.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Forge environment to deploy (development, staging, production)'
        required: true
        default: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: forge-deploy
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Forge deploy
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          npx forge settings set usage-analytics false
          npx forge deploy --environment "${{ github.event.inputs.environment }}" --non-interactive
