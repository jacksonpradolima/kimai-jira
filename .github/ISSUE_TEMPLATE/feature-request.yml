name: Feature request
description: Suggest an improvement to the Kimai for Jira integration.
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for helping shape the integration.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the ideal Jira and Kimai experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context

