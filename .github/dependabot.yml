version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      documentation-dependencies:
        patterns: ['*']
    labels: [dependencies, documentation]

